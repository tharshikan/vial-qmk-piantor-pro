name: Build Baseline Piantor Pro
on:
  push:
    branches:
      - test-base-commit
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Mark checkout as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt || pip3 install -r requirements.txt

      - name: Compile firmware
        run: qmk compile -kb beekeeb/piantor_pro -km vial

      - name: Prepare artifact folder
        run: |
          mkdir piantor_firmware
          mv *.uf2 *.hex *.bin piantor_firmware/ 2>/dev/null || true

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: piantor_pro_baseline
          path: piantor_firmware/
